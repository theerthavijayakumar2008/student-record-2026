<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Record Manager</title><style>body {  font-family: Arial, sans-serif;  background: #f1f5f9;  margin: 0;  padding: 20px;  color: #1e293b;}.container {  max-width: 1000px;  margin: auto;}header {  background: #4338ca;  color: white;  text-align: center;  padding: 25px;  border-radius: 14px;}.stats {  display: grid;  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));  gap: 15px;  margin: 20px 0;}.card, .panel {  background: white;  padding: 18px;  border-radius: 12px;  box-shadow: 0 2px 8px #0001;}.card h3 { color: #64748b; font-size: 14px; }.controls {  display: grid;  grid-template-columns: repeat(auto-fit,minmax(170px,1fr));  gap: 10px;  margin-bottom: 20px;}input, select, button {  width: 100%;  padding: 12px;  border: 1px solid #cbd5e1;  border-radius: 7px;  box-sizing: border-box;}button {  background: #4338ca;  color: white;  cursor: pointer;}.table-wrap { overflow-x: auto; }table { width: 100%; border-collapse: collapse; min-width: 650px; }th, td { padding: 13px; text-align: left; border-bottom: 1px solid #e2e8f0; }th { background: #e0e7ff; }footer { text-align: center; margin: 20px; }</style></head><body><div class="container"><header><h1>🎓 Student Record Manager</h1><p>Manage Student Details Easily</p><p>Search | Filter | Sort | Statistics</p></header><div class="stats"><div class="card"><h3>Total Students</h3><h2 id="total">0</h2></div><div class="card"><h3>Average Marks</h3><h2 id="average">0</h2></div><div class="card"><h3>Topper</h3><h2 id="topper">-</h2></div></div><div class="panel"><div class="controls"><input id="search" placeholder="Search student name"><select id="course"><option value="All">All Courses</option><option value="Computer Science">Computer Science</option><option value="Electronics">Electronics</option><option value="Mechanical">Mechanical</option></select><select id="marks"><option value="0">All Marks</option><option value="50">50 and above</option><option value="75">75 and above</option><option value="90">90 and above</option></select><select id="sort"><option value="default">Default Order</option><option value="name">Name A-Z</option><option value="high">Highest Marks</option><option value="low">Lowest Marks</option></select><button id="reset">Reset Filters</button></div><h2>Student Details</h2><div class="table-wrap"><table><thead><tr><th>No.</th><th>Student Name</th><th>Course</th><th>Marks</th><th>μID</th></tr></thead><tbody id="studentList"></tbody></table></div></div><footer>Created for μLearn Web Development Task</footer></div><script>const students = [ {name:"Ananya Nair",course:"Computer Science",marks:95,muId:"ananya@mulearn"}, {name:"Arjun Kumar",course:"Mechanical",marks:78,muId:"arjun@mulearn"}, {name:"Meera Thomas",course:"Electronics",marks:88,muId:"meera@mulearn"}, {name:"Rahul Das",course:"Computer Science",marks:82,muId:"rahul@mulearn"}, {name:"Diya Menon",course:"Electronics",marks:92,muId:"diya@mulearn"}, {name:"Adithya Raj",course:"Mechanical",marks:67,muId:"adithya@mulearn"}, {name:"Akhil Mohan",course:"Computer Science",marks:73,muId:"akhil@mulearn"}, {name:"Sneha Joseph",course:"Electronics",marks:85,muId:"sneha@mulearn"}, {name:"Vishnu Prasad",course:"Mechanical",marks:80,muId:"vishnu@mulearn"}];const search = document.getElementById("search");const course = document.getElementById("course");const marks = document.getElementById("marks");const sort = document.getElementById("sort");const list = document.getElementById("studentList");function displayStudents() {  const query = search.value.toLowerCase().trim();  let result = students.filter(student =>    student.name.toLowerCase().includes(query) &&    (course.value === "All" || student.course === course.value) &&    student.marks >= Number(marks.value)  );  if (sort.value === "name") {    result.sort((a,b) => a.name.localeCompare(b.name));  } else if (sort.value === "high") {    result.sort((a,b) => b.marks - a.marks);  } else if (sort.value === "low") {    result.sort((a,b) => a.marks - b.marks);  }  list.innerHTML = "";  result.forEach((student,index) => {    const row = document.createElement("tr");    [index+1,student.name,student.course,     student.marks,student.muId].forEach(value => {      const cell = document.createElement("td");      cell.textContent = value;      row.appendChild(cell);    });    list.appendChild(row);  });  const total = result.length;  const sum = result.reduce((acc,s) => acc + s.marks,0);  const average = total ? (sum/total).toFixed(1) : 0;  const topper = total    ? result.reduce((best,s) => s.marks > best.marks ? s : best).name    : "-";  document.getElementById("total").textContent = total;  document.getElementById("average").textContent = average;  document.getElementById("topper").textContent = topper;  if (total === 0) {    list.innerHTML = '<tr><td colspan="5">No students found</td></tr>';  }}search.addEventListener("input",displayStudents);course.addEventListener("change",displayStudents);marks.addEventListener("change",displayStudents);sort.addEventListener("change",displayStudents);document.getElementById("reset").addEventListener("click",() => {  search.value = "";  course.value = "All";  marks.value = "0";  sort.value = "default";  displayStudents();});displayStudents();</script></body></html>
